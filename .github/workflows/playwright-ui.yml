name: Playwright UI

on:
  push:
    branches:
      - test/playwright-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright behavior tests
        run: npm run test:e2e
      - name: Capture UI screenshots
        if: always()
        run: npm run ui:capture
      - name: Unit tests
        if: always()
        run: npm test
      - name: Syntax checks
        if: always()
        run: npm run test:syntax
      - name: Upload UI review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui
          if-no-files-found: error
          path: artifacts/ui/
