name: Playwright UI

on:
  push:
    branches:
      - test/playwright-ui
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Commit generated lockfile
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "chore: generate package lock [skip ci]"
            git push origin HEAD:test/playwright-ui
          fi
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test
      - name: Syntax checks
        if: always()
        run: npm run test:syntax
      - name: Playwright behavior tests
        if: always()
        run: npm run test:e2e
      - name: Capture UI screenshots
        if: always()
        run: npm run ui:capture
      - name: Upload UI review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui
          if-no-files-found: error
          path: |
            artifacts/ui/
            package-lock.json
